<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="180mm" viewBox="0 0 210 180">
  <title>Four textured stereo table reference markers</title>
  <desc>Four black and white, 35 millimeter square aperiodic checker patches, labeled TL, TR, BR, BL outside their patterns. Print at actual size.</desc>
  <rect width="210" height="180" fill="white"/>
