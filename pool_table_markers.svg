    <text x="105" y="10" font-size="5">Stereo table reference markers</text>
    <text x="105" y="17" font-size="3.5">Print at 100% / actual size. Each patterned square is 35 mm.</text>
  </g>
  <g id="marker-TL">
    <rect x="35" y="25" width="35" height="35" fill="white" stroke="black" stroke-width="0.2"/>
    <rect x="35" y="25" width="5" height="5" fill="black"/>
